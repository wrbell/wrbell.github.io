name: Update visual snapshots

# Visual baselines in tests/visual.spec.ts-snapshots/ are Linux renders
# (*-linux.png), so they cannot be regenerated on macOS / Windows.
# Run this from the Actions tab (or `gh workflow run update-snapshots.yml
# --ref <branch>`), download the `visual-snapshots` artifact, and commit the
# changed PNGs to the branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    name: Regenerate Linux baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same browser install as the Playwright job in ci.yml, so fonts and
      # system libraries match what the baselines are compared against.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Regenerate baselines
        run: >-
          npx playwright test tests/visual.spec.ts
          --project=chromium-desktop --project=iphone-safari
          --update-snapshots

      - name: Upload snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: visual-snapshots
          path: tests/visual.spec.ts-snapshots/
          if-no-files-found: error
