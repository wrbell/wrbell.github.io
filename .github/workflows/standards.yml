---
# Managed by standards/tools/adopt_standards.py.
# Re-run the tool to add or remove a domain; do not edit by hand.
# Jobs copied from wrbell/standards/.github/workflows/ at 0fe6a29de0f22af075ba51fafff9e03d1238d54d.
name: Standards
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  # From shell.yml.
  shell-lint:
    name: shell-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install ShellCheck
        if: "${{ hashFiles('**/*.sh', '**/*.bash') != '' }}"
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 755 \
            /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - name: Install shfmt
        if: "${{ hashFiles('**/*.sh', '**/*.bash') != '' }}"
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt
      - name: Run ShellCheck
        if: "${{ hashFiles('**/*.sh', '**/*.bash') != '' }}"
        run: |
          mapfile -t files < <(
            git ls-files '*.sh' '*.bash' \
              | grep -Ev '^(tests/fixtures/shell/fail/|\.agents/|third_party/)' \
              || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell files to check."
            exit 0
          fi
          shellcheck --severity=style \
            --rcfile enforcement/shellcheck/.shellcheckrc \
            -- "${files[@]}"
      - name: Run shfmt
        if: "${{ hashFiles('**/*.sh', '**/*.bash') != '' }}"
        run: |
          mapfile -t files < <(
            git ls-files '*.sh' '*.bash' \
              | grep -Ev '^(tests/fixtures/shell/fail/|\.agents/|third_party/)' \
              || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell files to format."
            exit 0
          fi
          shfmt -d -i 2 -ci -bn -- "${files[@]}"
  # From markdown.yml.
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Lint Markdown
        if: "${{ hashFiles('**/*.md') != '' }}"
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          config: enforcement/markdownlint/.markdownlint-cli2.yaml
          globs: "**/*.md"
  cspell:
    name: cspell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Node
        if: "${{ hashFiles('**/*.md') != '' }}"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Spell check
        if: "${{ hashFiles('**/*.md') != '' }}"
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/cspell" cspell@8.19.4
          "$RUNNER_TEMP/cspell/node_modules/.bin/cspell" \
            --config enforcement/cspell/cspell.json \
            "**/*.md"
  # From typescript-dotnet.yml.
  ts-lint:
    name: ts-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Node
        if: "${{ hashFiles('**/*.ts', '**/*.tsx') != '' }}"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Install TypeScript tools
        if: "${{ hashFiles('**/*.ts', '**/*.tsx') != '' }}"
        run: npm ci --prefix enforcement/typescript
      - name: Check ESLint and Prettier
        if: "${{ hashFiles('**/*.ts', '**/*.tsx') != '' }}"
        env:
          ESLINT_CONFIG: "enforcement/typescript/eslint.config.mjs"
          PRETTIER_CONFIG: "enforcement/typescript/.prettierrc.json"
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(git ls-files -z -- '*.ts' '*.tsx' \
            ':!.agents/**' ':!third_party/**' ':!tests/fixtures/**')
          bin="enforcement/typescript/node_modules/.bin"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No TypeScript sources outside fixtures and vendored trees."
          else
            if [ ! -f "$ESLINT_CONFIG" ]; then
              echo "ESLint config not found: $ESLINT_CONFIG"
              exit 1
            fi
            if [ ! -f "$PRETTIER_CONFIG" ]; then
              echo "Prettier config not found: $PRETTIER_CONFIG"
              exit 1
            fi
            "$bin/eslint" --config "$ESLINT_CONFIG" "${files[@]}"
            "$bin/prettier" --check --config "$PRETTIER_CONFIG" "${files[@]}"
          fi
          if [ -f tsconfig.json ]; then
            "$bin/tsc" --noEmit -p tsconfig.json
          else
            echo "No tsconfig.json. Skip tsc on the tree."
          fi
      - name: Self-test TypeScript configs
        if: "${{ hashFiles('tests/fixtures/typescript-dotnet/eslint/pass/*.ts') != '' }}"
        env:
          ESLINT_CONFIG: "enforcement/typescript/eslint.config.mjs"
          PRETTIER_CONFIG: "enforcement/typescript/.prettierrc.json"
          TSCONFIG: "enforcement/typescript/tsconfig.base.json"
        run: |
          set -euo pipefail
          if [ ! -f "$TSCONFIG" ]; then
            echo "Base tsconfig not found: $TSCONFIG"
            exit 1
          fi
          bin="enforcement/typescript/node_modules/.bin"
          "$bin/eslint" --config "$ESLINT_CONFIG" \
            tests/fixtures/typescript-dotnet/eslint/pass/count.ts
          if "$bin/eslint" --config "$ESLINT_CONFIG" \
            tests/fixtures/typescript-dotnet/eslint/fail/count.ts; then
            echo "The failing ESLint sample must not pass."
            exit 1
          fi
          "$bin/prettier" --check --config "$PRETTIER_CONFIG" \
            tests/fixtures/typescript-dotnet/prettier/pass/count.ts
          if "$bin/prettier" --check --config "$PRETTIER_CONFIG" \
            tests/fixtures/typescript-dotnet/prettier/fail/count.ts; then
            echo "The failing Prettier sample must not pass."
            exit 1
          fi
          "$bin/tsc" --noEmit -p \
            tests/fixtures/typescript-dotnet/tsc/pass/tsconfig.json
          if "$bin/tsc" --noEmit -p \
            tests/fixtures/typescript-dotnet/tsc/fail/tsconfig.json; then
            echo "The failing tsc sample must not pass."
            exit 1
          fi
  dotnet-format:
    name: dotnet-format
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up .NET
        if: "${{ hashFiles('**/*.cs', '**/*.csproj') != '' }}"
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Check dotnet format
        if: "${{ hashFiles('**/*.cs', '**/*.csproj') != '' }}"
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(git ls-files -z -- '*.cs' \
            ':!.agents/**' ':!third_party/**' ':!tests/fixtures/**')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C# sources outside fixtures and vendored trees."
            exit 0
          fi
          projects=()
          while IFS= read -r -d '' project; do
            projects+=("$project")
          done < <(git ls-files -z -- '*.csproj' '*.sln' \
            ':!.agents/**' ':!third_party/**' ':!tests/fixtures/**')
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "C# sources exist, but no project file exists."
            exit 1
          fi
          args=(--verify-no-changes)
          for dir in .agents third_party tests/fixtures; do
            if [ -d "$dir" ]; then
              args+=(--exclude "$dir")
            fi
          done
          dotnet format "${args[@]}"
      - name: Self-test dotnet configs
        if: "${{ hashFiles('tests/fixtures/typescript-dotnet/dotnet/pass/*.cs') != '' }}"
        env:
          DOTNET_EDITORCONFIG: "enforcement/typescript/dotnet.editorconfig"
          DIRECTORY_BUILD_PROPS: "enforcement/typescript/Directory.Build.props"
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP:-/tmp}/dotnet-self-test"
          rm -rf "$work"
          mkdir -p "$work/pass" "$work/fail" "$work/props-fail"
          stage() {
            source_dir="$1"
            dest_dir="$2"
            cp "${source_dir}/"*.cs "${dest_dir}/"
            cp "${source_dir}/"*.csproj "${dest_dir}/"
            cp "$DOTNET_EDITORCONFIG" "${dest_dir}/.editorconfig"
            cp "$DIRECTORY_BUILD_PROPS" "${dest_dir}/Directory.Build.props"
          }
          stage tests/fixtures/typescript-dotnet/dotnet/pass "$work/pass"
          dotnet format "$work/pass/"*.csproj --verify-no-changes
          stage tests/fixtures/typescript-dotnet/dotnet/fail "$work/fail"
          if dotnet format "$work/fail/"*.csproj --verify-no-changes; then
            echo "The failing dotnet format sample must not pass."
            exit 1
          fi
          stage tests/fixtures/typescript-dotnet/directory-build-props/fail \
            "$work/props-fail"
          build_log="$work/props-fail-build.txt"
          dotnet build "$work/props-fail/"*.csproj --nologo \
            > "$build_log" 2>&1
          if ! grep -q CA1822 "$build_log"; then
            echo "Directory.Build.props did not report CA1822."
            cat "$build_log"
            exit 1
          fi
  # From docs-structure.yml.
  docs-lint:
    name: docs-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check docs structure
        if: "${{ hashFiles('tools/check_docs.py') != '' }}"
        run: python3 tools/check_docs.py
      - name: Lint README headings
        if: "${{ hashFiles('templates/README.template.md') != '' }}"
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          config: enforcement/docs/readme.markdownlint-cli2.jsonc
          globs: |
            templates/README.template.md
      - name: Lint decision record headings
        if: "${{ hashFiles('docs/decisions/*.md') != '' }}"
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          config: enforcement/docs/adr.markdownlint-cli2.jsonc
          globs: |
            docs/decisions/*.md
  # From agentic-coding.yml.
  agents-md-lint:
    name: agents-md-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # hashFiles is empty before checkout, so the gate is on this step.
      - name: Check agent instruction files
        if: >-
          ${{ hashFiles('AGENTS.md', 'templates/AGENTS.md', 'CLAUDE.md',
          'templates/CLAUDE.md', '.cursor/rules/**',
          'templates/.cursor/rules/**') != '' }}
        run: |
          set -euo pipefail
          if [ ! -f tools/agents_md_lint.py ]; then
            echo "tools/agents_md_lint.py is missing. Copy it from wrbell/standards."
            exit 1
          fi
          python3 tools/agents_md_lint.py
      - name: Lint AGENTS.md
        if: >-
          ${{ hashFiles('enforcement/markdownlint/.markdownlint-cli2.yaml') != ''
          && hashFiles('**/AGENTS.md') != '' }}
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          config: enforcement/markdownlint/.markdownlint-cli2.yaml
          globs: "**/AGENTS.md"
  # From git-commits-versioning.yml.
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        if: >-
          ${{ hashFiles('enforcement/commitlint/commitlint.config.js',
          'commitlint.config.js') != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Install commitlint
        if: >-
          ${{ hashFiles('enforcement/commitlint/commitlint.config.js',
          'commitlint.config.js') != '' }}
        run: |
          set -eu
          if [ -f enforcement/commitlint/package.json ]; then
            npm install --prefix enforcement/commitlint --no-fund --no-audit
          else
            npm install --prefix /tmp/commitlint-tools --no-fund --no-audit \
              @commitlint/cli@21.2.3 @commitlint/config-conventional@21.2.3
          fi
      - name: Lint commit messages
        if: >-
          ${{ hashFiles('enforcement/commitlint/commitlint.config.js',
          'commitlint.config.js') != '' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ -x enforcement/commitlint/node_modules/.bin/commitlint ]; then
            bin=enforcement/commitlint/node_modules/.bin/commitlint
            export NODE_PATH="$PWD/enforcement/commitlint/node_modules"
            config=enforcement/commitlint/commitlint.config.js
          else
            bin=/tmp/commitlint-tools/node_modules/.bin/commitlint
            export NODE_PATH=/tmp/commitlint-tools/node_modules
            config=commitlint.config.js
          fi
          pass=tests/fixtures/git-commits-versioning/commit-pass.txt
          fail=tests/fixtures/git-commits-versioning/commit-fail.txt
          if [ -f "$pass" ]; then
            "$bin" --config "$config" --verbose < "$pass"
            if "$bin" --config "$config" --verbose < "$fail"; then
              echo "The failing commit sample passed." >&2
              exit 1
            fi
          fi
          # Squash-merge writes the pull request title onto main.
          # The blocking check is that title, in code-review.yml.
          # Lint only new commits on a push to main.
          # Do not lint feature-branch commits. Force-push is banned.
          # 08d0df8..8860e41 is already on main and is not conventional.
          from_sha=
          to_sha=
          if [ "${EVENT_NAME}" = "push" ] && \
            [ "${GIT_REF}" = "refs/heads/main" ] && \
            [ -n "${PUSH_BEFORE}" ] && \
            [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]
          then
            from_sha=${PUSH_BEFORE}
            to_sha=${PUSH_SHA}
          fi
          if [ -n "${from_sha}" ]; then
            "$bin" --config "$config" --from "${from_sha}" --to "${to_sha}" \
              --verbose
          else
            echo "No new commits on main. Skip the live commit check."
          fi
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check the branch name
        if: ${{ hashFiles('enforcement/commitlint/check_branch_name.sh') != '' }}
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref || '' }}
        run: |
          set -eu
          script=enforcement/commitlint/check_branch_name.sh
          pass=tests/fixtures/git-commits-versioning/branch-pass.txt
          fail=tests/fixtures/git-commits-versioning/branch-fail.txt
          if [ -f "$pass" ]; then
            while IFS= read -r sample || [ -n "$sample" ]; do
              [ -z "$sample" ] && continue
              "$script" "$sample"
            done < "$pass"
            while IFS= read -r sample || [ -n "$sample" ]; do
              [ -z "$sample" ] && continue
              if "$script" "$sample"; then
                echo "The failing branch sample passed." >&2
                exit 1
              fi
            done < "$fail"
          fi
          for name in \
            ai/task \
            claude/task \
            codex/task \
            copilot/task \
            cursor/fix-header-bug \
            standards/review-git-api \
            dependabot/pip/numpy-2.1.0
          do
            "$script" "$name"
          done
          if [ -n "${BRANCH_NAME}" ]; then
            "$script" "$BRANCH_NAME"
          else
            echo "No pull request branch. Skip the live branch check."
          fi
  # From security-supply-chain.yml.
  actions-lint:
    name: actions-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check action pins and permissions
        if: "${{ hashFiles('enforcement/gitleaks/check_workflows.py') != '' }}"
        run: |
          python3 enforcement/gitleaks/check_workflows.py \
            .github/workflows \
            templates/.github/workflows
      - name: Check Dependabot config
        if: "${{ hashFiles('enforcement/dependabot/check_dependabot.py') != '' }}"
        run: python3 enforcement/dependabot/check_dependabot.py
      - name: Install actionlint
        if: "${{ hashFiles('.github/workflows/*.yml', '.github/workflows/*.yaml') != '' }}"
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 755 /tmp/actionlint /usr/local/bin/actionlint
      - name: Run actionlint
        if: "${{ hashFiles('.github/workflows/*.yml', '.github/workflows/*.yaml') != '' }}"
        run: actionlint -color
  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        if: "${{ hashFiles('enforcement/gitleaks/.gitleaks.toml', '**/.gitleaks.toml') != '' }}"
        run: |
          set -euo pipefail
          version="8.30.1"
          file="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${file}"
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            -o "/tmp/${file}" "$url"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/${file}" | sha256sum -c
          tar -xzf "/tmp/${file}" -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        if: "${{ hashFiles('enforcement/gitleaks/.gitleaks.toml', '**/.gitleaks.toml') != '' }}"
        run: |
          set -euo pipefail
          if [ -f .gitleaks.toml ]; then
            config=".gitleaks.toml"
          elif [ -f enforcement/gitleaks/.gitleaks.toml ]; then
            config="enforcement/gitleaks/.gitleaks.toml"
          else
            echo "No .gitleaks.toml found."
            exit 1
          fi
          gitleaks detect --source . --config "$config" --redact --verbose
      - name: Check gitleaks allow comments
        if: "${{ hashFiles('enforcement/gitleaks/check_allow_comments.py') != '' }}"
        run: python3 enforcement/gitleaks/check_allow_comments.py
