name: Deploy to GitHub Pages

on:
  # Only runs after CI completes successfully on main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy if CI passed — skip on failure or cancellation
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # Job-level scopes: checkout reads the repo; deploy-pages needs
    # pages: write and id-token: write.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      # This job uploads the repository root. upload-pages-artifact@v3
      # omits only .git and .github. GitHub Pages does not run Jekyll
      # on this artifact, so a _config.yml exclude has no effect.
      # Dot paths are public today (.gitignore returns 200). Remove the
      # agent files and the collection-standards tooling and config so
      # they are not site pages. No page or spec uses these paths.
      - name: Omit agent files from the Pages artifact
        run: |
          rm -rf .agents .claude docs/agents enforcement tools
          rm -f AGENTS.md CLAUDE.md .standards.json .pre-commit-config.yaml .editorconfig

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
