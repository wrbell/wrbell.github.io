<!DOCTYPE html>
<!-- Source for assets/og-image.png + og-card.png (1200x630). Regenerate: node scripts/og-image.mjs -->
<html lang="en"><head><meta charset="utf-8"><title>OG image</title><style>
@font-face{font-family:Inter;font-weight:400 700;src:url(../assets/fonts/inter-latin.v1.woff2)}
@font-face{font-family:JBM;font-weight:400 700;src:url(../assets/fonts/jetbrains-mono-latin.v1.woff2)}
@font-face{font-family:Fraunces;font-weight:400 700;src:url(../assets/fonts/fraunces-latin.v1.woff2)}
@font-face{font-family:Fraunces;font-style:italic;font-weight:400 700;src:url(../assets/fonts/fraunces-latin-italic.v1.woff2)}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#0a0a12;color:#e6e6ee;overflow:hidden}
body{position:relative;
 background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
 background-size:60px 60px;background-position:-1px -1px}
.frame{position:absolute;inset:48px;border:1px solid #1e1e2e}
.c{position:absolute;width:22px;height:22px;border-color:#00e5a0;border-style:solid}
.tl{top:-1px;left:-1px;border-width:2px 0 0 2px}.tr{top:-1px;right:-1px;border-width:2px 2px 0 0}
.bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px}.br{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.mono{font-family:JBM;letter-spacing:.08em;text-transform:uppercase}
.top{position:absolute;left:96px;top:108px;font-size:17px;color:#9a9ab2}
.avail{position:absolute;left:96px;top:142px;font-size:14px;color:#b8b8cc;display:flex;align-items:center;gap:10px}
.avail i{width:10px;height:10px;border-radius:50%;background:#00e5a0}
.rule{position:absolute;left:96px;top:186px;width:64px;height:2px;background:#00e5a0}
.url{position:absolute;right:96px;top:108px;font-size:15px;color:#9a9ab2;text-transform:none;letter-spacing:.02em}
h1{position:absolute;left:88px;top:196px;font-family:Fraunces;font-weight:400;font-size:168px;letter-spacing:-.035em;line-height:1}
h1 b{font-weight:400;color:#00e5a0}
.sub{position:absolute;left:96px;top:392px;font-family:Fraunces;font-style:italic;font-size:40px;color:#b8b8cc}
.sub em{color:#e6e6ee}
.vit{position:absolute;left:96px;right:96px;top:490px;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:24px}
.vit .l{font-size:13px;color:#9a9ab2;margin-bottom:10px}
.vit .v{font-family:JBM;font-size:19px;color:#e6e6ee}
</style></head><body>
<div class="frame"><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span></div>
<div class="top mono">Portfolio · Fall 2026</div>
<div class="url mono">wrbell.github.io</div>
<div class="avail mono"><i></i>Available · new grad Q1 2027</div>
<div class="rule"></div>
<h1>Willem <b>Bell.</b></h1>
<div class="sub">Mechanical engineer · <em>controls, automation, test</em></div>
<div class="vit">
 <div><div class="l mono">Graduating</div><div class="v">Dec 2026 · BSME</div></div>
 <div><div class="l mono">Experience</div><div class="v">SpaceX ×5 · Tesla</div></div>
 <div><div class="l mono">Based</div><div class="v">Dearborn, MI</div></div>
</div>
</body></html>
